[FREELOADER]
DefaultOS=Setup
TimeOut=0

[Display]
TitleText=ReactOS Setup
MinimalUI=Yes

[Operating Systems]
Setup="Setup"
Setup_Debug="Setup (Debug)"
Setup_Aacpi="Setup ACPI APIC (Debug)"
Setup_Screen="Setup (Screen)"

[Setup]
BootType=ReactOSSetup
Options= /redirect=com2 /redirectbaudrate=115200

[Setup_Debug]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE /redirect=com2 /redirectbaudrate=115200

[Setup_Aacpi]
BootType=ReactOSSetup
Options=/HAL=halaacpi.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE /redirect=com2 /redirectbaudrate=115200

[Setup_Screen]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE /redirect=com2 /redirectbaudrate=115200
